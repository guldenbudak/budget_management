{% extends 'base.html' %}
{% block content %}
<h1>Hoş geldin {{ user.username }}</h1>
<h2>Bütçelerim</h2>
<ul>
    {% for budget in budgets %}
    <li><a href="{% url 'budget_detail' budget.id %}">{{ budget.name }}</a></li>
    {% empty %}
    <li>Bütçe Bulunamadı !</li>
    {% endfor %}
</ul>

{% endblock %}
