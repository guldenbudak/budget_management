<style>
  .errorlist { color: #b00020; }
</style>

<h1>Kayıt Ol</h1>

<!-- method="post" = sifre gonderiyoruz. GET olsaydi sifre adres cubuginda gorunur
     ve tarayici gecmisine yazilirdi. csrf_token olmadan Django formu reddeder. -->
<form method="post">
  {% csrf_token %}

  <!-- form.as_p = RegisterForm'un dort alanini (kullanici adi, e-posta ve iki
       sifre) hata mesajlariyla birlikte Django kendisi bassin. -->
  {{ form.as_p }}

  <button type="submit">Kayıt Ol</button>
</form>

<p>Zaten hesabın var mı? <a href="{% url 'login' %}">Giriş yap</a></p>
